name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run check
      - run: npm test
      - run: npm run test:bridge
      - run: npm --prefix helper ci
      - run: npm --prefix helper run check
      - run: npm --prefix helper test
      - run: npm run package:helper
      - run: npm run build:public
      - run: python3 scripts/scan-public-source.py --history --artifacts
